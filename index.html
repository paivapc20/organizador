<style>
:root{--ink:#1c2740;--ink2:#3a4863;--paper:#efece3;--line:#d6d1c2;--line2:#b7b1a0;--brass:#8a6d2f;--stamp:#9c3b2e;--ok:#2f6b4f;--muted:#6b6558;--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hidden{display:none!important}
/* ---- cabecera ---- */
header.app{background:var(--ink);color:#f3f1ea;padding:10px 16px 0;padding-top:calc(10px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));border-bottom:3px solid var(--brass)}
.hrow{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;flex:none}
.brand{min-width:0}.brand b{font:700 18px var(--serif);display:block;line-height:1.15}
.brand small{color:#9fd3b6;font-size:11px;display:block;min-height:13px}
#ps{margin-left:auto;background:#28344f;color:#fff;border:1px solid #3a4a68;border-radius:7px;padding:7px 8px;font-size:13px;max-width:46vw}
.groups{display:flex;gap:6px;margin-top:10px}
.groups button{flex:1;background:#28344f;border:1px solid #3a4a68;color:#d5dae6;padding:10px 8px;border-radius:8px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.groups button.on{background:var(--brass);border-color:var(--brass);color:#fff}
.subs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.subs::-webkit-scrollbar{display:none}
.subs button{flex:none;background:0;border:0;color:#c7ccd8;padding:9px 13px;border-radius:7px 7px 0 0;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.subs button.on{background:var(--paper);color:var(--ink)}
main{padding:16px;max-width:1180px;margin:0 auto;padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));padding-bottom:calc(30px + env(safe-area-inset-bottom))}
/* ---- bloques comunes ---- */
.tb,.box,.rb{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.tb{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.sp{flex:1}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
select,input[type=text],input[type=number]{font:inherit;padding:9px;border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--ink);min-width:140px;max-width:100%}
select:focus,input:focus{outline:2px solid var(--brass);outline-offset:-1px}
.pill{font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--line);padding:6px 12px;border-radius:20px}
button.a,label.a{background:var(--ink);color:#fff;border:0;padding:10px 15px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;display:inline-block;margin:3px 3px 3px 0;font-family:inherit}
button.a:hover,label.a:hover{background:var(--ink2)}
button.a:disabled{background:var(--line2);cursor:not-allowed}
button.pr{background:var(--brass)}button.d{background:var(--stamp)}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 12px;cursor:pointer}
.switch input{width:17px;height:17px;accent-color:var(--brass)}
.emp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:40px 20px;text-align:center;color:var(--muted)}
.emp .big{font-size:34px;margin-bottom:8px}
.w{overflow:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #9aa3b5;padding:5px 7px;text-align:center}
th{background:#eef0f4;font-size:11px}
td.l,th.l{text-align:left}
.tot td{background:#f3f1ea;font-weight:800}
.dk th{background:var(--ink);color:#fff}
h2{text-align:center;font-size:16px;text-transform:uppercase;margin:0 0 12px;letter-spacing:.4px}
h3{font-size:14px;margin:16px 0 8px}
.nt{font-size:11.5px;color:var(--muted);margin-top:8px}
.wn{background:#fff6e9;border:1px solid #e6c98a;color:#7a5a12;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.ok{background:#eef5f0;border:1px solid #a9cbb7;color:#245c3f;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.gc{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.gc>b{display:block;background:var(--ink);color:#fff;padding:9px 12px}
.gc div{padding:8px 12px;border-bottom:1px solid var(--line)}.gc input{width:100%;margin-top:3px}
.tag{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:11px}
.k1,.k2,.k3{font-size:20px;font-weight:800}.k1{background:#dbeafe}.k2{background:#fde2e2}.k3{background:#fdf3c7}
.big2{font-size:19px}.red{color:var(--stamp)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{background:#fff;border:1px solid var(--line2);color:var(--ink);padding:9px 14px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.frow{display:flex;flex-wrap:wrap;gap:14px 12px;align-items:flex-end;padding:8px 0}
#bn{position:fixed;left:0;right:0;bottom:0;background:var(--brass);color:#fff;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#bn button{margin:0}
/* ---- casillas ---- */
.cb{display:inline-grid;place-items:center;width:13px;height:13px;border:1.4px solid var(--ink);vertical-align:middle;font-size:11px;line-height:1;font-weight:900;color:var(--stamp);flex:none}
.cb.on::after{content:"\2715"}
/* ---- tarjeta S-21 ---- */
.cards{display:flex;flex-direction:column;gap:26px}
.s21card{background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:16px 18px 14px;max-width:960px;margin:0 auto;width:100%;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.s21card .title{font-family:var(--serif);text-align:center;font-size:15.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:12px}
.idrow{display:flex;gap:10px;margin-bottom:6px;align-items:baseline;flex-wrap:wrap}
.idrow .lbl{font-size:12px;font-weight:700}
.idrow .val{font-family:var(--mono);border-bottom:1px solid var(--ink);min-width:120px;padding:0 6px 1px;font-size:13px;flex:1}
.idrow .val.name{font-weight:700;flex:2}
.checkline{display:flex;gap:6px 18px;flex-wrap:wrap;margin:4px 0}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.rule{border:none;border-top:1px solid var(--line);margin:9px 0}
.syline{display:flex;align-items:baseline;gap:8px;margin:8px 0 6px;font-size:12.5px;font-weight:700}
.syline .yr{font-family:var(--mono);font-size:14px;border-bottom:1.4px solid var(--ink);padding:0 12px}
table.s21{table-layout:fixed;font-size:11.5px}
table.s21 th,table.s21 td{border:1px solid var(--ink2);padding:3px 5px;vertical-align:middle}
table.s21 thead th{background:#eef0f4;font-size:10px;line-height:1.2;text-align:center}
table.s21 td.mon{font-weight:600;white-space:nowrap;text-align:left}
table.s21 td.c{text-align:center}table.s21 td.r{text-align:right;font-family:var(--mono)}
table.s21 td.nt2{font-size:10.5px;text-align:left}
table.s21 tr.total td{background:#f3f1ea;font-weight:800}
.foot{margin-top:8px;font-size:9.5px;color:var(--muted);display:flex;justify-content:space-between}
.cw1{width:15%}.cw2{width:12%}.cw3{width:9%}.cw4{width:12%}.cw5{width:10%}
/* ---- informe de publicadores ---- */
.repblock{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px 20px;margin:0 auto 22px;max-width:960px}
.repblock h2{margin-bottom:14px;font-weight:800}
table.rep{table-layout:fixed;font-size:12.5px}
table.rep th,table.rep td{border:1px solid var(--ink);padding:5px 6px}
table.rep thead th{background:#fff;font-size:10.5px;line-height:1.25}
table.rep thead th .sy{display:block;font-weight:800;margin-top:3px;font-size:12px}
table.rep td.mon{text-align:left;padding-left:9px}
table.rep td.num{font-family:var(--mono);font-size:13px}
table.rep td.zero{color:#9a978d}
table.rep tr.total td{border:none;font-weight:800;background:#fff}
table.rep tr.total td.tlabel{text-align:right;padding-right:10px}
table.rep tr.total td.tval{border:1px solid var(--ink);font-family:var(--mono)}
/* ---- S-88 ---- */
.s88sheet{background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:16px 18px 18px;max-width:1000px;margin:0 auto 26px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.s88sheet .title{font-family:var(--serif);text-align:center;font-size:15px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:14px}
.s88pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.s88pair .kind{font-size:12.5px;font-weight:700;text-align:center;margin-bottom:5px;border-bottom:1.4px solid var(--ink);padding-bottom:3px}
table.s88{table-layout:fixed;font-size:11.5px}
table.s88 th,table.s88 td{border:1px solid var(--ink2);padding:3px 5px}
table.s88 thead th{background:#eef0f4;font-size:9.5px;line-height:1.2}
table.s88 thead th .sy{display:block;font-weight:800;font-size:11.5px;margin-top:2px}
table.s88 td.mon{text-align:left;font-weight:600;padding-left:7px;white-space:nowrap}
table.s88 td.num{font-family:var(--mono);font-size:12px}
table.s88 td.dash{color:#a8a498}
table.s88 tr.avg td{background:#f3f1ea;font-weight:800}
table.s88 tr.avg td.lbl{text-align:right;font-size:10px}
/* ---- pantallas pequeñas ---- */
@media(max-width:820px){
  main{padding-top:12px}
  .tb{padding:12px;gap:10px}.tb .f{flex:1 1 140px}.tb .sp{display:none}
  .tb select,.tb input[type=text]{width:100%;min-width:0}
  .tb .pill{order:5}.tb button.a{width:100%;order:6}
  select,input[type=text],input[type=number]{font-size:16px}
  .s88pair{grid-template-columns:1fr}
  .s21card{padding:14px 12px 12px}.repblock{padding:14px 10px}
  table.s21{font-size:10px}table.s21 th,table.s21 td{padding:2px 3px}
  table.rep{font-size:11px}
}
@media(max-width:480px){.brand b{font-size:16px}body{font-size:13px}.groups button{font-size:12.5px;padding:9px 4px}}
/* ---- tablet ---- */
@media(min-width:768px) and (max-width:1100px){main{padding:18px 22px}.subs button{padding:10px 16px;font-size:14px}}
/* ---- modo consulta / solo S-21 ---- */
body.ro .edit{display:none!important}
body.only #gn,body.only #ps{display:none!important}
/* ---- impresión ---- */
@media print{
  header.app,.tb,.seg,.wn,.ok,.no,#bn,.nt.no{display:none!important}
  body{background:#fff}main{padding:0;max-width:none}
  .s21card{box-shadow:none;border:1.4px solid #000;page-break-after:always;max-width:none;margin:0}
  .s21card:last-child{page-break-after:auto}
  .cards{gap:0}
  .repblock{border:none;padding:0;margin:0 0 26px;max-width:none;page-break-inside:avoid}
  .s88sheet{box-shadow:none;border:1.4px solid #000;max-width:none;margin:0;page-break-inside:avoid}
  .rb{border-color:#000;page-break-inside:avoid}
  table.s88 th,table.s88 td,table.rep th,table.rep td{border-color:#000}
  .cb{color:#000}
  @page{size:A4;margin:12mm}
}
</style></head><body>
<header class="app">
  <div class="hrow">
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#28344f"/><rect x="140" y="104" width="232" height="290" rx="20" fill="#efece3"/><rect x="140" y="104" width="232" height="56" rx="20" fill="#8a6d2f"/><rect x="140" y="140" width="232" height="20" fill="#8a6d2f"/><g fill="none" stroke="#1c2740" stroke-width="12" stroke-linecap="round"><rect x="168" y="188" width="30" height="30" rx="5"/><rect x="168" y="244" width="30" height="30" rx="5"/><rect x="168" y="300" width="30" height="30" rx="5"/></g><g stroke="#9c3b2e" stroke-width="12" stroke-linecap="round"><path d="M175 195l16 16M191 195l-16 16"/></g><g stroke="#3a4863" stroke-width="14" stroke-linecap="round"><path d="M226 203h116M226 259h116M226 315h84"/></g><circle cx="372" cy="388" r="62" fill="#2f6b4f" stroke="#1c2740" stroke-width="12"/><path d="M342 388l22 22 40-46" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="brand"><b id="ttl">Organizador</b><small id="sv"></small></div>
    <select id="ps" onchange="sw(this.value)" title="Perfil"></select>
  </div>
  <nav class="groups" id="gn"></nav>
  <nav class="subs" id="nv"></nav>
</header>
<main id="mn"></main>
<div id="bn" class="hidden"><span>Hay una versión nueva de la aplicación.</span><button class="a" onclick="upd()">Actualizar ahora</button></div>
<script>
/* ======================= Organizador (Registros + S-21) ======================= */
const $=i=>document.getElementById(i);
const MO=[["Septiembre",9],["Octubre",10],["Noviembre",11],["Diciembre",12],["Enero",1],["Febrero",2],["Marzo",3],["Abril",4],["Mayo",5],["Junio",6],["Julio",7],["Agosto",8]];
const MN={};MO.forEach(x=>MN[x[1]]=x[0]);
const MS=MO.map(x=>[x[1],x[0]]).sort((a,b)=>a[0]-b[0]);
const MI={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12,janeiro:1,fevereiro:2,marco:3,maio:5,junho:6,julho:7,setembro:9,outubro:10,novembro:11,dezembro:12};
const norm=s=>(s==null?"":String(s)).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ");
const nk=s=>norm(s).replace(/[,.]/g," ").split(" ").filter(w=>w&&!["de","del","la","las","los","y"].includes(w)).sort().join(" ");
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yes=v=>["si","sim","yes","y","x","1","true","v"].includes(norm(v));
const one=v=>v!=null&&(norm(v)==="1"||Number(v)===1);
const num=v=>{if(v==null||v==="")return null;const n=Number(String(v).trim().replace(",","."));return isNaN(n)?null:n};
const p2=n=>String(n).padStart(2,"0");
const r1=x=>Math.round(x*10)/10, r2=x=>Math.round(x*100)/100;
function fd(v){
  if(v==null||v===""||v===0)return"";
  if(typeof v==="number"&&isFinite(v)){if(v<=0)return"";const d=new Date(Math.round((v-25569)*864e5));return isNaN(d)?String(v):p2(d.getUTCDate())+"/"+p2(d.getUTCMonth()+1)+"/"+d.getUTCFullYear()}
  if(v instanceof Date){return isNaN(v)?"":p2(v.getDate())+"/"+p2(v.getMonth()+1)+"/"+v.getFullYear()}
  const s=String(v).trim(),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[3]+"/"+m[2]+"/"+m[1];
  const b=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);if(b)return p2(b[1])+"/"+p2(b[2])+"/"+b[3];
  return s;
}
const hmap=r=>{const m={};r.forEach((h,i)=>{if(h!=null&&String(h).trim())m[norm(h)]=i});return m};
function fc(h,...n){for(const x of n)if(h[x]!=null)return h[x];for(const x of n)for(const k in h)if(k.includes(x))return h[k];return-1}
const tsv=v=>v==null?0:typeof v==="number"?v:(Date.parse(v)||0);

/* ======================= Estado, perfiles y autoguardado ======================= */
let S=null,P=null,PR=[],RO=false,ONLY=false,EMB=null,BND=null,DP=null,REG=null;
const F={};
let GR="reg",TAB="inf";
const KP="orgreg_p",KC="orgreg_c",KD="orgreg_d_";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const blank=()=>({pubs:[],rep:{},att:{},aa:{},gm:{},files:{},ini:{}});
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
let quotaWarned=false;
function lsSet(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));return true}
  catch(e){if(!quotaWarned){quotaWarned=true;alert("No se pudo guardar en este dispositivo (¿almacenamiento lleno o bloqueado?). Descarga una copia de seguridad en Configuración › Copias y compartir.")}return false}
}
let saveT=null;
function save(){BND=null;if(ONLY||RO||!P)return;clearTimeout(saveT);saveT=setTimeout(flush,350)}
function flush(){
  clearTimeout(saveT);saveT=null;if(ONLY||RO||!P)return;
  if(lsSet(KD+P.id,S))$("sv").textContent="✓ Guardado automáticamente "+new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"});
}
addEventListener("pagehide",()=>{if(saveT)flush()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&saveT)flush()});

function normalizeState(){
  S.pubs.forEach(p=>{p.key=nk(p.nome);p.fl=p.fl||{}});
  const o={};for(const k in S.rep){const q=k.split("|");o[nk(q[0])+"|"+q[1]+"|"+q[2]]=S.rep[k]}S.rep=o;
  BND=null;
}
function fillProfiles(){
  $("ps").innerHTML=PR.map(p=>`<option value="${p.id}"${P&&p.id===P.id?" selected":""}>${p.ro?"👁 ":"👤 "}${esc(p.name)}</option>`).join("");
}
function load(){
  PR=lsGet(KP)||[];
  if(!PR.length){PR=[{id:uid(),name:"Mi perfil"}];lsSet(KP,PR)}
  let cur=null;try{cur=localStorage.getItem(KC)}catch(e){}
  P=PR.find(p=>p.id===cur)||PR[0];
  try{localStorage.setItem(KC,P.id)}catch(e){}
  S=Object.assign(blank(),lsGet(KD+P.id)||{});
  RO=!!P.ro;
  normalizeState();fillProfiles();
  $("sv").textContent=RO?"👁 Copia de solo consulta":(hasD()?"✓ Datos guardados en este dispositivo":"");
  document.body.classList.toggle("ro",RO);
}
function sw(id){if(saveT)flush();try{localStorage.setItem(KC,id)}catch(e){}load();F.cs=null;go()}

/* ======================= Cálculos ======================= */
const SYM=sy=>MO.map(x=>({y:x[1]>=9?sy-1:sy,m:x[1]}));
const E=(p,y,m)=>S.rep[p.key+"|"+y+"|"+m];
const na=(p,y,m)=>{const t=S.ini[p.key];return!!t&&y*12+m<t.y*12+t.m};
const rea=(p,y,m)=>{const t=S.ini[p.key];return!!t&&y*12+m>=t.y*12+t.m};
const irr=(p,y,m)=>{const e=E(p,y,m);return!(e&&yes(e.pa))};
const ymOf=i=>{const y=Math.floor((i-1)/12);return{y,m:i-y*12}};
function bnd(){
  if(BND)return BND;
  let mn=1e9,mx=-1;
  for(const k in S.rep){const a=k.split("|"),i=+a[1]*12+ +a[2];if(i<mn)mn=i;if(i>mx)mx=i}
  return BND={mn,mx,ina:null};
}
/* Inactivos hoy: 6+ meses seguidos sin participar (hasta el último mes con datos) o 0 en "Situación" */
function inactSet(){
  const b=bnd();
  if(b.ina)return b.ina;
  const s=new Set();
  if(b.mx>=0){
    const t=ymOf(b.mx);
    S.pubs.forEach(p=>{if(streak(p,b.mx,true)>=6||(p.sit===false&&!rea(p,t.y,t.m)))s.add(p.key)});
  }
  return b.ina=s;
}
/* meses seguidos sin participar que terminan en idx (incl=true cuenta idx) */

/* Cálculo automático de los totales de la congregación para un año de servicio */
function aaCalc(sy){
  const ms=SYM(sy);let last=-1;
  for(let i=11;i>=0&&last<0;i--)if(S.pubs.some(p=>E(p,ms[i].y,ms[i].m)))last=i;
  if(last<0)return null;
  const idx=i=>ms[i].y*12+ms[i].m,lix=idx(last),w0=lix-5;
  const act=new Set(),nuevos=new Set(),reac=new Set();
  S.pubs.forEach(p=>{
    for(let i=w0;i<=lix;i++){const t=ymOf(i);if(!na(p,t.y,t.m)&&!irr(p,t.y,t.m)){act.add(p.key);break}}
    for(let i=0;i<=last;i++){
      const ix=idx(i),t=ms[i];
      if(streak(p,ix,true)===6)nuevos.add(p.key);
      if(!irr(p,t.y,t.m)&&streak(p,ix-1,true)>=6)reac.add(p.key);
    }
    const ini=S.ini[p.key];
    if(ini&&ini.t==="r"){const k=ini.y*12+ini.m;if(k>=idx(0)&&k<=idx(11))reac.add(p.key)}
  });
  const nm=s=>S.pubs.filter(p=>s.has(p.key)).map(p=>p.nome);
  return{act:act.size,nuevos:nuevos.size,reac:reac.size,aN:nm(act),nN:nm(nuevos),rN:nm(reac),w0:ymOf(w0),w1:ymOf(lix),lastM:ms[last].m};
}

const DES=["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];

const DNAME=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function anomalies(years){
  const list=[],all=[];
  Object.values(S.att).forEach(e=>{
    const sy=e.m>=9?e.y+1:e.y;
    if(!years.includes(sy)||!e.d)return;
    all.push(e);
    if(!e.tx)return;
    const w=norm(e.tx).split(",")[0],real=new Date(Date.UTC(e.y,e.m-1,e.d)).getUTCDay(),iE=DES.indexOf(w),iP=DPT.indexOf(w);
    if(iE<0&&iP<0)return;
    if(iE>=0?iE!==real:iP!==real)list.push(`&ldquo;${esc(e.tx)}&rdquo; &mdash; esa fecha cayó en <b>${DNAME[real]}</b>`);
  });
  all.sort((a,b)=>Date.UTC(a.y,a.m-1,a.d)-Date.UTC(b.y,b.m-1,b.d));
  for(let i=1;i<all.length;i++){
    const p=all[i-1],c=all[i];
    if(!!p.w!==!!c.w)continue;
    const diff=(Date.UTC(c.y,c.m-1,c.d)-Date.UTC(p.y,p.m-1,p.d))/864e5;
    if(diff>=1&&diff<=2){
      const t1=p.tx||(p.d+"/"+p.m+"/"+p.y),t2=c.tx||(c.d+"/"+c.m+"/"+c.y);
      list.push(`&ldquo;${esc(t1)}&rdquo; (${p.a}) y &ldquo;${esc(t2)}&rdquo; (${c.a}) &mdash; dos reuniones del mismo tipo en días seguidos`);
    }
  }
  return list;
}

function pDate(v){

const vaciar=()=>{if(!confirm("¿Borrar todos los datos de este perfil?"))return;S=blank();BND=null;save();flush();go()};
const editable=()=>{P.ro=false;lsSet(KP,PR);load();go()};
const stamp=()=>new Date().toISOString().slice(0,10);
const slug=s=>String(s).replace(/\W+/g,"_");
const cp=()=>{const n="respaldo_"+slug(P.name)+"_"+stamp()+".json";return{n,f:new File([JSON.stringify({app:"orp",v:2,name:P.name,date:new Date().toISOString(),data:S})],n,{type:"application/json"})}};
async function sendF(f){
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:f.name});return}catch(e){if(e.name==="AbortError")return}}
  dl(f);
}
function dl(f){const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
const compartir=()=>sendF(cp().f);
const bajar=()=>dl(cp().f);

/* Guarda SOLO el Organizador S-21 (tarjetas, informe de publicadores, S-88 e inactivos) con los datos incrustados */
function guardarHtml(){
  if(!hasD())return;
  const c=document.documentElement.cloneNode(true);
  ["nv","gn","mn","ps"].forEach(i=>{const e=c.querySelector("#"+i);if(e)e.innerHTML=""});
  c.querySelector("#sv").textContent="";
  c.querySelector("#bn").classList.add("hidden");
  c.querySelector("body").className="";
  c.querySelectorAll("script[src]").forEach(s=>s.remove());
  c.querySelectorAll('link[rel="manifest"],link[rel="icon"],link[rel="apple-touch-icon"]').forEach(s=>s.remove());
  const o=c.querySelector("#orp-embed");if(o)o.remove();
  const data={pubs:S.pubs,rep:S.rep,att:S.att,ini:S.ini,files:S.files};
  const t=document.createElement("script");
  t.id="orp-embed";t.type="application/json";
  t.textContent=JSON.stringify({only:"s21",name:P.name,date:new Date().toISOString(),data}).replace(/</g,"\\u003c");
  c.querySelector("body").prepend(t);
  sendF(new File(["<!DOCTYPE html>\n"+c.outerHTML],"organizador_s21_"+slug(P.name)+"_"+stamp()+".html",{type:"text/html"}));
}

/* Convierte copias de las versiones anteriores */
function conv(d){
  if(d.rep&&Array.isArray(d.rep)){
    const n=blank();
    n.pubs=(d.pubs||[]).map(p=>({nome:p.nome,key:nk(p.nome),grupo:p.grupo,nasc:p.nasc,bat:p.bat,sit:p.situacao==null?null:p.situacao,fl:Object.assign({},p.flags,{sup:(p.flags||{}).supGrupo,ayd:(p.flags||{}).aydGrupo})}));
    d.rep.forEach(([k,e])=>{const q=k.split("|");n.rep[nk(q[0])+"|"+q[1]+"|"+q[2]]={pr:e.prec,pa:e.particip,h:e.horas,c:e.cursos,n:e.coment||"",t:0}});
    (d.att||[]).forEach(a=>n.att[a[0]+"-"+a[1]+"-"+a[2]+"-"+a[3]]={y:a[0],m:a[1],d:a[2],w:a[3],a:a[4],n:a[6]||1,tx:a[5]||"",t:0});
    const x=d.aaManual||{};
    for(const y in x){const m=x[y];n.aa[y]={activos:m.activos,sordos:m.sordos,inN:m.inactivosNuevos,ciegos:m.ciegos,reac:m.reactivados,enc:m.encarcelados,ter:m.territorios,nop:m.noPredicados}}
    for(const g in d.groupsManual||{})n.gm[g]={s:d.groupsManual[g].sup,a:d.groupsManual[g].ayd};
    n.files=d.fileNames||{};
    return n;
  }
  return Object.assign(blank(),d);
}
function importar(f){
  if(!f)return;
  const r=new FileReader;
  r.onload=e=>{
    try{
      const j=JSON.parse(e.target.result),d=j.app==="orp"?j.data:j;
      if(!d||(!d.pubs&&!d.att&&!d.rep))throw 0;
      const who=j.name||j.owner||"otra persona";
      const ro=confirm("Copia recibida de “"+who+"”.\n\nAceptar = abrir SOLO PARA CONSULTAR (no se puede modificar).\nCancelar = abrir como copia EDITABLE.");
      mk((j.name||j.owner||"Importado")+" (copia)",conv(d),ro);
      alert(ro?"Copia abierta en modo consulta.":"Copia abierta como perfil editable.");
    }catch(x){alert("El archivo no parece ser una copia válida de esta aplicación.")}
  };
  r.readAsText(f);
}

function cfgDatos(){
  const first=!hasD()?`<div class="ok">👋 <b>Bienvenido.</b> Para empezar, carga tus tres planillas de Excel (o escribe los datos en <b>✍ Registrar</b>). Todo se guarda solo en este dispositivo.</div>`:"";

  ldBox("📃","Publicadores.xlsx","pub","lPub")+ldBox("✉","Informe de predicación.xlsx","rep","lRep")+ldBox("📅","Asistencias a las reuniones.xlsx","att","lAtt")+

R.cfg=()=>{
  const subs=[["reg","✍ Registrar"],["datos","📂 Datos y perfil"],["copia","📤 Copias y compartir"],["app","📲 Aplicación"]].filter(x=>!(RO&&x[0]==="reg"));

  return nav+({reg:cfgReg,datos:cfgDatos,copia:cfgCopia,app:cfgApp}[cs])();
};

/* ======================= Navegación ======================= */
const GROUPS=[["reg","Organizador de Registros"],["s21","Organizador S-21"]];
const TABS={
  reg:[["inf","Informes"],["asis","Asistencia"],["preg","Precursores"],["aa","Análisis de la congregación"],["irr","Irregulares"],["pub","Lista de publicadores"],["grp","Grupos"],["cfg","⚙ Configuración"]],
  s21:[["s21","Tarjetas S-21"],["rel","Informe de Publicadores"],["reu","Reuniones (S-88)"],["ina","Inactivos"]]
};
const LAST={reg:"inf",s21:"s21"};
function setGr(g){LAST[GR]=TAB;GR=g;TAB=LAST[g];go();scrollTo(0,0)}
function setTab(t){TAB=t;go();scrollTo(0,0)}
function go(){
  const tabs=TABS[GR];
  if(!tabs.some(t=>t[0]===TAB))TAB=tabs[0][0];
  $("gn").innerHTML=ONLY?"":GROUPS.map(g=>`<button class="${g[0]===GR?"on":""}" onclick="setGr('${g[0]}')">${g[1]}</button>`).join("");
  $("nv").innerHTML=tabs.map(t=>`<button class="${t[0]===TAB?"on":""}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join("");
  const sc=scrollY;
  try{$("mn").innerHTML=R[TAB]()}catch(e){console.error(e);$("mn").innerHTML=`<div class="wn">Ocurrió un error al mostrar esta sección: ${esc(e.message)}</div>`}
  scrollTo(0,sc);
  if(TAB==="cfg"&&$("an"))atFill();
}

/* ======================= Inicio ======================= */
function init(){
  const em=$("orp-embed");
  if(em){try{EMB=JSON.parse(em.textContent)}catch(e){}}
  if(EMB&&EMB.only==="s21"){
    ONLY=true;RO=true;
    S=Object.assign(blank(),EMB.data||{});P={id:"emb",name:EMB.name||"Compartido",ro:true};
    normalizeState();
    document.body.classList.add("ro","only");
    $("ttl").textContent="Organizador S-21";
    $("sv").textContent="👁 Copia de solo consulta"+(EMB.name?" · "+EMB.name:"")+(EMB.date?" · "+EMB.date.slice(0,10):"");
    GR="s21";TAB="s21";
    go();
    return;
  }
  load();
  if(!hasD()){GR="reg";TAB="cfg";F.cs="datos"}
  go();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0){
    navigator.serviceWorker.register("sw.js").then(r=>{
      REG=r;
      const w=()=>{if(r.waiting&&navigator.serviceWorker.controller)$("bn").classList.remove("hidden")};
      w();
      r.addEventListener("updatefound",()=>{const n=r.installing;if(n)n.addEventListener("statechange",()=>{if(n.state==="installed")w()})});
    }).catch(()=>{});
    let rl=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!rl){rl=true;location.reload()}});
  }
}
init();
